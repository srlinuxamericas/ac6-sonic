router bgp 64500
 bgp router-id 11.11.11.11
 bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax 
 no bgp ebgp-requires-policy
 neighbor 1.1.1.1 remote-as 64501
 neighbor 1.1.1.1 ebgp-multihop 2
 neighbor 1.1.1.1 update-source 11.11.11.11
 neighbor 192.168.10.2 remote-as 64501
 neighbor 192.168.20.2 remote-as 64502
 neighbor 2.2.2.2 remote-as 64502
 neighbor 2.2.2.2 ebgp-multihop 2
 neighbor 2.2.2.2 update-source 11.11.11.11
 !
 address-family ipv4 unicast
  network 11.11.11.11/32 
  no neighbor 1.1.1.1 activate
  neighbor 192.168.10.2 activate
  neighbor 192.168.20.2 activate
  no neighbor 2.2.2.2 activate
  maximum-paths 64
 exit-address-family
 !
 address-family ipv6 unicast
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 1.1.1.1 activate
  neighbor 2.2.2.2 activate
 exit-address-family
