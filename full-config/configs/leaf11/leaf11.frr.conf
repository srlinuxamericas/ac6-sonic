frr version 10.5.4
frr defaults traditional
hostname leaf11
log syslog informational
log facility local4
agentx
fpm address 127.0.0.1
no fpm use-next-hop-groups
service integrated-vtysh-config
!
route-map RM_EVPN_GSHUT_IN permit 10
 match community CL_GSHUT
 set local-preference 0
exit
!
route-map RM_EVPN_GSHUT_IN permit 20
exit
!
password zebra
enable password zebra
!
vrf Vrf_Type5
 ip router-id 1.1.1.1
 vni 10999
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 64501
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 11.11.11.11 remote-as 64500
 neighbor 11.11.11.11 ebgp-multihop 2
 neighbor 11.11.11.11 update-source Loopback0
 neighbor 22.22.22.22 remote-as 64500
 neighbor 22.22.22.22 ebgp-multihop 2
 neighbor 22.22.22.22 update-source Loopback0
 neighbor 192.168.10.3 remote-as 64500
 neighbor 192.168.12.3 remote-as 64500
 !
 address-family ipv4 unicast
  network 1.1.1.1/32
  no neighbor 11.11.11.11 activate
  no neighbor 22.22.22.22 activate
  neighbor 192.168.10.3 route-map RM_EVPN_GSHUT_IN in
  neighbor 192.168.12.3 route-map RM_EVPN_GSHUT_IN in
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 11.11.11.11 activate
  neighbor 11.11.11.11 route-map RM_EVPN_GSHUT_IN in
  neighbor 22.22.22.22 activate
  neighbor 22.22.22.22 route-map RM_EVPN_GSHUT_IN in
  advertise-all-vni
 exit-address-family
exit
!
router bgp 64501 vrf Vrf_Type5
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  network 10.80.1.0/24
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 1.1.1.1:10999
  route-target import 64999:10999
  route-target export 64999:10999
 exit-address-family
exit
!
bgp community-list standard CL_GSHUT seq 5 permit graceful-shutdown
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 traffic-eng
 exit
exit
!
