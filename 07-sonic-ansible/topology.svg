<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Spine-leaf VXLAN network topology</title>
<style>
  .bg { fill: #ffffff; }
  .line { stroke: #333333; }
  .node-fill { fill: #0b1f3a; }
  .node-icon { stroke: #ffffff; }
  .label-accent { fill: #1a6fb5; }
  .label-success { fill: #1d9e75; }
  .box-text { fill: #1a1a1a; }
  .box-fill { fill: #ffffff; }
  .box-stroke { stroke: #cccccc; }
  .vxlan-fill { fill: #e6f1fb; }
  .vxlan-stroke { stroke: #1a6fb5; }
  .vxlan-green-fill { fill: #eaf3de; }
  .vxlan-green-stroke { stroke: #639922; }
  .client-fill { fill: #b5d4f4; }
  .client-stroke { stroke: #0c447c; }

  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .line { stroke: #8b949e; }
    .node-fill { fill: #1f6feb; }
    .node-icon { stroke: #0d1117; }
    .label-accent { fill: #79c0ff; }
    .label-success { fill: #7ee2b8; }
    .box-text { fill: #e6edf3; }
    .box-fill { fill: #161b22; }
    .box-stroke { stroke: #30363d; }
    .vxlan-fill { fill: #112d4e; }
    .vxlan-stroke { stroke: #58a6ff; }
    .vxlan-green-fill { fill: #1a2e1a; }
    .vxlan-green-stroke { stroke: #7ee2b8; }
    .client-fill { fill: #1f6feb; }
    .client-stroke { stroke: #79c0ff; }
  }
</style>

<rect class="bg" x="0" y="0" width="680" height="620"/>

<!-- Spine-to-Spine link -->
<line class="line" x1="230" y1="80" x2="450" y2="80" stroke-width="1.5" fill="none"/>

<!-- Spine to Leaf links (full mesh) -->
<line class="line" x1="210" y1="100" x2="190" y2="260" stroke-width="1.5" fill="none"/>
<line class="line" x1="230" y1="100" x2="430" y2="260" stroke-width="1.5" fill="none"/>
<line class="line" x1="450" y1="100" x2="210" y2="260" stroke-width="1.5" fill="none"/>
<line class="line" x1="460" y1="100" x2="470" y2="260" stroke-width="1.5" fill="none"/>

<!-- VXLAN tunnel (dashed) -->
<line class="line" x1="210" y1="300" x2="430" y2="300" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>

<!-- Leaf to client links -->
<line class="line" x1="175" y1="320" x2="110" y2="430" stroke-width="1.2" fill="none"/>
<line class="line" x1="195" y1="320" x2="230" y2="430" stroke-width="1.2" fill="none"/>
<line class="line" x1="450" y1="320" x2="390" y2="430" stroke-width="1.2" fill="none"/>
<line class="line" x1="470" y1="320" x2="540" y2="430" stroke-width="1.2" fill="none"/>

<!-- SPINE11 -->
<g>
  <circle class="node-fill" cx="220" cy="80" r="30"/>
  <line class="node-icon" x1="208" y1="80" x2="232" y2="80" stroke-width="2" fill="none"/>
  <line class="node-icon" x1="220" y1="68" x2="220" y2="92" stroke-width="2" fill="none"/>
  <line class="node-icon" x1="210" y1="70" x2="230" y2="90" stroke-width="1.5" fill="none"/>
  <line class="node-icon" x1="230" y1="70" x2="210" y2="90" stroke-width="1.5" fill="none"/>
</g>
<text class="label-accent" x="220" y="38" text-anchor="middle" font-size="14" font-weight="500" font-family="sans-serif">SPINE11</text>

<!-- SPINE12 -->
<g>
  <circle class="node-fill" cx="460" cy="80" r="30"/>
  <line class="node-icon" x1="448" y1="80" x2="472" y2="80" stroke-width="2" fill="none"/>
  <line class="node-icon" x1="460" y1="68" x2="460" y2="92" stroke-width="2" fill="none"/>
  <line class="node-icon" x1="450" y1="70" x2="470" y2="90" stroke-width="1.5" fill="none"/>
  <line class="node-icon" x1="470" y1="70" x2="450" y2="90" stroke-width="1.5" fill="none"/>
</g>
<text class="label-accent" x="460" y="38" text-anchor="middle" font-size="14" font-weight="500" font-family="sans-serif">SPINE12</text>

<!-- LEAF11 -->
<g>
  <circle class="node-fill" cx="200" cy="290" r="30"/>
  <line class="node-icon" x1="188" y1="290" x2="212" y2="290" stroke-width="2" fill="none"/>
  <line class="node-icon" x1="200" y1="278" x2="200" y2="302" stroke-width="2" fill="none"/>
  <line class="node-icon" x1="190" y1="280" x2="210" y2="300" stroke-width="1.5" fill="none"/>
  <line class="node-icon" x1="210" y1="280" x2="190" y2="300" stroke-width="1.5" fill="none"/>
</g>
<text class="label-accent" x="140" y="295" text-anchor="middle" font-size="14" font-weight="500" font-family="sans-serif">LEAF11</text>
<text class="box-text" x="176" y="338" text-anchor="end" font-size="12" font-family="sans-serif">Eth36</text>
<text class="box-text" x="224" y="338" text-anchor="start" font-size="12" font-family="sans-serif">Eth40</text>

<!-- LEAF12 -->
<g>
  <circle class="node-fill" cx="460" cy="290" r="30"/>
  <line class="node-icon" x1="448" y1="290" x2="472" y2="290" stroke-width="2" fill="none"/>
  <line class="node-icon" x1="460" y1="278" x2="460" y2="302" stroke-width="2" fill="none"/>
  <line class="node-icon" x1="450" y1="280" x2="470" y2="300" stroke-width="1.5" fill="none"/>
  <line class="node-icon" x1="470" y1="280" x2="450" y2="300" stroke-width="1.5" fill="none"/>
</g>
<text class="label-accent" x="530" y="295" text-anchor="middle" font-size="14" font-weight="500" font-family="sans-serif">LEAF12</text>
<text class="box-text" x="436" y="338" text-anchor="end" font-size="12" font-family="sans-serif">Eth36</text>
<text class="box-text" x="484" y="338" text-anchor="start" font-size="12" font-family="sans-serif">Eth40</text>

<!-- Vlan130 tagged labels -->
<text class="label-success" x="230" y="378" text-anchor="middle" font-size="12" font-weight="500" font-family="sans-serif">Vlan130 tagged</text>
<text class="label-success" x="460" y="378" text-anchor="middle" font-size="12" font-weight="500" font-family="sans-serif">Vlan130 tagged</text>

<!-- VXLAN tunnel box -->
<rect class="vxlan-fill vxlan-stroke" x="258" y="195" width="164" height="90" rx="8" stroke-width="1.5" stroke-dasharray="6 3"/>
<text class="box-text" x="340" y="185" text-anchor="middle" font-size="14" font-weight="500" font-family="sans-serif">VXLAN tunnel · 1.1.1.1 ↔ 2.2.2.2</text>
<rect class="box-fill box-stroke" x="262" y="199" width="156" height="24" rx="3" stroke-width="1"/>
<text class="box-text" x="340" y="215" text-anchor="middle" font-size="12" font-family="sans-serif">VNI 10110 · L2 · Vlan110</text>
<rect class="box-fill box-stroke" x="262" y="225" width="156" height="24" rx="3" stroke-width="1"/>
<text class="box-text" x="340" y="241" text-anchor="middle" font-size="12" font-family="sans-serif">VNI 10999 · L3 · Vrf_Type5</text>
<rect class="vxlan-green-fill vxlan-green-stroke" x="262" y="251" width="156" height="30" rx="3" stroke-width="1"/>
<text class="label-success" x="340" y="270" text-anchor="middle" font-size="12" font-family="sans-serif">VNI 10130 · L2 · Vlan130</text>

<!-- CLIENT1 (hexagon) -->
<polygon class="client-fill client-stroke" points="110,422 128,412 146,422 146,442 128,452 110,442" stroke-width="1.5"/>
<text class="label-accent" x="80" y="410" text-anchor="middle" font-size="14" font-weight="500" font-family="sans-serif">CLIENT1</text>
<rect class="box-fill box-stroke" x="60" y="458" width="100" height="38" rx="4" stroke-width="1"/>
<text class="box-text" x="110" y="473" text-anchor="middle" font-size="12" font-family="sans-serif">eth1 · Vlan110</text>
<text class="box-text" x="110" y="488" text-anchor="middle" font-size="12" font-family="sans-serif">172.16.10.x</text>

<!-- CLIENT2 (hexagon) -->
<polygon class="client-fill client-stroke" points="230,422 248,412 266,422 266,442 248,452 230,442" stroke-width="1.5"/>
<text class="label-accent" x="248" y="410" text-anchor="middle" font-size="14" font-weight="500" font-family="sans-serif">CLIENT2</text>
<rect class="box-fill box-stroke" x="198" y="458" width="100" height="38" rx="4" stroke-width="1"/>
<text class="box-text" x="248" y="473" text-anchor="middle" font-size="12" font-family="sans-serif">eth1 · 10.80.1.1</text>
<text class="label-success" x="248" y="488" text-anchor="middle" font-size="12" font-family="sans-serif">eth1.130 · 172.16.30.2</text>

<!-- CLIENT3 (hexagon) -->
<polygon class="client-fill client-stroke" points="390,422 408,412 426,422 426,442 408,452 390,442" stroke-width="1.5"/>
<text class="label-accent" x="360" y="410" text-anchor="middle" font-size="14" font-weight="500" font-family="sans-serif">CLIENT3</text>
<rect class="box-fill box-stroke" x="340" y="458" width="100" height="38" rx="4" stroke-width="1"/>
<text class="box-text" x="390" y="473" text-anchor="middle" font-size="12" font-family="sans-serif">eth1 · Vlan110</text>
<text class="box-text" x="390" y="488" text-anchor="middle" font-size="12" font-family="sans-serif">172.16.10.60</text>

<!-- CLIENT4 (hexagon) -->
<polygon class="client-fill client-stroke" points="520,422 538,412 556,422 556,442 538,452 520,442" stroke-width="1.5"/>
<text class="label-accent" x="560" y="410" text-anchor="middle" font-size="14" font-weight="500" font-family="sans-serif">CLIENT4</text>
<rect class="box-fill box-stroke" x="488" y="458" width="104" height="38" rx="4" stroke-width="1"/>
<text class="box-text" x="540" y="473" text-anchor="middle" font-size="12" font-family="sans-serif">eth1 · 10.90.1.1</text>
<text class="label-success" x="540" y="488" text-anchor="middle" font-size="12" font-family="sans-serif">eth1.130 · 172.16.30.4</text>

</svg>
