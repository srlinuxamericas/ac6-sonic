name: ac6-sonic

mgmt:
  network: ac6-sonic-lab-mgmt
  ipv4-subnet: 172.40.40.0/24

prefix: ""
topology:
  defaults:
    kind: sonic-vm
  kinds:
    sonic-vm:
      image: vrnetlab/sonic_sonic-vs:202605
    linux:
      image: ghcr.io/mfzhsn/network-multitool-sshd:0.0.5

  nodes:
    leaf11:
      mgmt-ipv4: 172.40.40.2

    leaf12:
      mgmt-ipv4: 172.40.40.4

    spine11:
      mgmt-ipv4: 172.40.40.3

    spine12:
      mgmt-ipv4: 172.40.40.5

    client1:
      kind: linux
      mgmt-ipv4: 172.40.40.10
      exec:
        - ip address add 172.16.10.50/24 dev eth1

    client2:
      kind: linux
      mgmt-ipv4: 172.40.40.11
      exec:
        - ip address add 10.80.1.1/24 dev eth1
        - ip route add 10.90.1.0/24 via 10.80.1.254
        - ip link add link eth1 name eth1.130 type vlan id 130
        - ip address add 172.16.30.2/24 dev eth1.130
        - ip link set eth1.130 up

    client3:
      kind: linux
      mgmt-ipv4: 172.40.40.12
      exec:
        - ip address add 172.16.10.60/24 dev eth1

    client4:
      kind: linux
      mgmt-ipv4: 172.40.40.13
      exec:
        - ip address add 10.90.1.1/24 dev eth1
        - ip route add 10.80.1.0/24 via 10.90.1.254
        - ip link add link eth1 name eth1.130 type vlan id 130
        - ip address add 172.16.30.4/24 dev eth1.130
        - ip link set eth1.130 up

    ## Telemetry Stack

    gnmic:
      kind: linux
      image: ghcr.io/openconfig/gnmic:0.47.0
      binds:
        - 02-sonic-bgp-evpn/configs/gnmic/gnmic-config.yml:/gnmic-config.yml:ro
      cmd: --config /gnmic-config.yml --log subscribe

    gnmic-counters:
      kind: linux
      image: ghcr.io/openconfig/gnmic:0.47.0
      binds:
        - 02-sonic-bgp-evpn/configs/gnmic/gnmic-counters.yml:/gnmic-config.yml:ro
      cmd: --config /gnmic-config.yml --log subscribe

    prometheus:
      kind: linux
      image: quay.io/prometheus/prometheus:v2.54.1
      binds:
        - 02-sonic-bgp-evpn/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      cmd: --config.file=/etc/prometheus/prometheus.yml
      ports:
        - 9090:9090

    grafana:
      kind: linux
      image: grafana/grafana:latest
      binds:
        - 02-sonic-bgp-evpn/configs/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
        - 02-sonic-bgp-evpn/configs/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
        - 02-sonic-bgp-evpn/configs/grafana/dashboards:/var/lib/grafana/dashboards
      ports:
        - 3000:3000
      env:
        # GF_AUTH_ANONYMOUS_ENABLED: "true"
        # GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
        # GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
        # GF_AUTH_DISABLE_LOGIN_FORM: "true"
        GF_PLUGINS_PREINSTALL: andrewbmchugh-flow-panel@1.20.1 

  links:
    # spine-leaf links
    - endpoints: [ "leaf11:eth1", "spine11:eth1" ]
    - endpoints: [ "leaf12:eth1", "spine11:eth2" ]
    - endpoints: [ "leaf11:eth2", "spine12:eth1" ]
    - endpoints: [ "leaf12:eth2", "spine12:eth2" ]
    # leaf-client links
    - endpoints: [ "client1:eth1", "leaf11:eth10" ]
    - endpoints: [ "client2:eth1", "leaf11:eth11" ]
    - endpoints: [ "client3:eth1", "leaf12:eth10" ]
    - endpoints: [ "client4:eth1", "leaf12:eth11" ]

